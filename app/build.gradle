plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.rebeccabro.theweddingpath'

    // Enterprise Stability Constraint:
    // Intentionally targeting SDK 36. Do not upgrade to SDK 37 until the
    // newer API is proven fully stable and required by project parameters.
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.rebeccabro.theweddingpath"
        minSdk 28
        // Will evaluate Android 15/16 (SDK 37+)
        // compatibility modes prior to final production release.
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.cardview
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.jbcrypt
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}